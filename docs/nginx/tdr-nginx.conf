# TDR — Nginx Reference Configuration
# Trade Data Refinery-Bushra — Production Nginx Reference v1.0
# Date: 2026-09-22
#
# This is a REFERENCE CONFIGURATION — not a production-ready file as-is.
# Replace ALL <placeholders> before use.
# Do not commit TLS certificate paths or real domain names to this repository.
#
# Topology:
#   yourdomain.com          → Next.js frontend (:3000)
#   yourdomain.com/api/*    → NestJS backend (:4000)
#   yourdomain.com/auth/*   → NestJS backend (:4000)
#   yourdomain.com/tdr/*    → NestJS backend (:4000)
#   yourdomain.com/health/* → NestJS backend (:4000)
#   yourdomain.com/metrics  → NestJS backend (:4000) — network-restrict recommended

# Upstream definitions
upstream tdr_backend {
    server 127.0.0.1:4000;
    keepalive 16;
}

upstream tdr_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name <your-domain.com>;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS main server
server {
    listen 443 ssl;
    http2 on;
    server_name <your-domain.com>;

    # TLS — replace with actual certificate paths
    ssl_certificate     /etc/ssl/certs/<your-domain.com>.pem;
    ssl_certificate_key /etc/ssl/private/<your-domain.com>-key.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Body size — must match or exceed backend upload limit (500 MB)
    client_max_body_size 510M;

    # Timeouts for large file uploads and long-running operations
    client_body_timeout      300s;
    proxy_read_timeout       300s;
    proxy_send_timeout       300s;
    proxy_connect_timeout    10s;

    # Common proxy headers
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ── Backend routes ────────────────────────────────────────────────────────
    # All API, auth, TDR, health, and metrics paths go to NestJS backend.

    location ~ ^/(api|auth|tdr|health|version)(/|$) {
        proxy_pass http://tdr_backend;
    }

    # Metrics endpoint — restrict to scraper IP or internal network
    # In production: uncomment the allow/deny rules and set the scraper IP.
    location /metrics {
        # Uncomment to restrict to Prometheus scraper IP:
        # allow <scraper-ip>;
        # deny all;
        proxy_pass http://tdr_backend;
    }

    # ── Frontend ──────────────────────────────────────────────────────────────
    # All other requests go to Next.js frontend.

    location / {
        proxy_pass http://tdr_frontend;

        # Next.js HMR websocket (dev only — remove in production)
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }

    # Static assets from Next.js — cache aggressively
    location /_next/static/ {
        proxy_pass http://tdr_frontend;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/html;
        internal;
    }
}
